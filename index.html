<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Australia 2026</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,300..600,0..1,0&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <header class="app-header">
    <div class="header-inner">
      <div>
        <div class="eyebrow">Journey</div>
        <h1>Australia 2026</h1>
      </div>
      <div class="header-actions">
        <button class="icon-btn" data-panel="weather" aria-label="Weather"><span class="material-symbols-rounded">partly_cloudy_day</span></button>
        <button class="icon-btn" data-panel="flight" aria-label="Flight Hub"><span class="material-symbols-rounded">flight_takeoff</span></button>
        <button class="icon-btn" data-panel="transport" aria-label="Transport"><span class="material-symbols-rounded">tram</span></button>
        <button class="icon-btn" data-panel="help" aria-label="Help"><span class="material-symbols-rounded">support_agent</span></button>
        <button class="icon-btn" data-panel="driving" aria-label="Driving Guide"><span class="material-symbols-rounded">directions_car</span></button>
        <button class="icon-btn" data-panel="payment" aria-label="Payment"><span class="material-symbols-rounded">credit_card</span></button>
      </div>
    </div>
  </header>

  <main class="app-main">
    <nav class="date-tabs" id="dateTabs"></nav>

    <section class="layout" id="mainSwipeArea">
      <div class="stack">
        <article class="card hero-card" id="heroCard"></article>
        <article class="card day-warning-card" id="dayWarningCard" hidden></article>
        <article class="card" id="reminderCard"></article>
        <article class="card" id="timelineCard"></article>
      </div>
    </section>
  </main>

  <button type="button" class="scroll-top-btn" id="scrollTopBtn" aria-label="Back to top">
    <span class="material-symbols-rounded">keyboard_arrow_up</span>
  </button>

  <div class="modal-backdrop" id="modalBackdrop">
    <div class="modal">
      <div class="modal-head">
        <div>
          <div class="eyebrow">Panel</div>
          <h2 id="modalTitle"></h2>
          <p class="theme" id="modalSubtitle"></p>
        </div>
        <button class="close-btn" id="closeModal" aria-label="Close">×</button>
      </div>
      <div id="modalItems"></div>
    </div>
  </div>

  <script src="./data.js"></script>
  <script src="./script.js"></script>
</body>
</html>
